<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOBI | Gestão Imobiliária</title>
  <link rel="stylesheet" href="landing.css" />
  <script src="theme.js"></script>
</head>
<body>
  <main class="landing">
    <header class="header">
      <a href="telainicial.html" class="mini-logo" aria-label="MOBI - início">
        <svg viewBox="0 0 250 150" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-linejoin="miter">
            <path d="M10 128h18V69l45-26v42l45 27v116h17" stroke-width="3.5"/>
            <path d="M37.5 75v53M82.5 87v41" stroke-width="2.5"/>
            <path d="M92 50l32 18v28l-32-19z" stroke-width="2.5"/>
          </g>
          <g fill="currentColor">
            <rect x="50" y="95" width="5" height="5"/>
            <rect x="69" y="95" width="5" height="5"/>
            <rect x="50" y="113" width="5" height="5"/>
            <rect x="69" y="113" width="5" height="5"/>
          </g>
        </svg>
      </a>
      <nav aria-label="Navegação principal">
        <a href="#solucoes">Soluções</a>
        <i></i>
        <a href="cadastro.html">Usuários</a>
        <i></i>
        <a href="#planos">Planos</a>
        <i></i>
        <a href="login.html">Login</a>
        <button 
          id="theme-toggle" 
          class="theme-toggle"
          aria-label="Mudar para modo escuro"
          aria-pressed="false"
          onclick="toggleTheme()"
          title="Alternar tema"
        >
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </nav>
    </header>

    <section class="hero" id="solucoes">
      <div class="hero-copy">
        <p class="eyebrow">Simplifique a gestão,</p>
        <h1><strong>POTENCIALIZE</strong><span> SEUS RESULTADOS</span></h1>
        <div class="divider"></div>
        <p>Plataforma inteligente para gerenciar suas propriedades imobiliárias com eficiência.</p>
      </div>
      <div class="building-art" aria-hidden="true">
        <svg viewBox="0 0 760 650" role="img">
          <defs>
            <linearGradient id="glow" x1="0" x2="1">
              <stop stop-color="#7736cf" stop-opacity=".35"/>
              <stop offset=".72" stop-color="#a34dc9" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <path d="M100 600h500V150l100-80v120l100 60v350h80" fill="none" stroke="currentColor" stroke-width="8" stroke-linejoin="miter"/>
          <rect x="150" y="200" width="80" height="80" fill="url(#glow)" opacity=".5"/>
          <rect x="350" y="250" width="80" height="80" fill="url(#glow)" opacity=".3"/>
        </svg>
      </div>
    </section>
  </main>
</body>
</html>
