<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar senha | MOBI</title>
  <link rel="stylesheet" href="style.css" />
  <script src="theme.js"></script>
</head>
<body>
  <main class="page">
    <section class="brand-panel" aria-label="MOBI Gestão Imobiliária">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 510 285" role="img">
          <g fill="none" stroke="currentColor" stroke-linejoin="miter">
            <path d="M35 252h27V69l67-40v62l67 41v120h26" stroke-width="5.5"/>
            <path d="M66 72v180M129 91v161M137 42l48 30v42l-48-29z" stroke-width="5"/>
          </g>
          <g fill="currentColor">
            <rect x="85" y="111" width="8" height="8"/>
            <rect x="110" y="111" width="8" height="8"/>
            <rect x="85" y="137" width="8" height="8"/>
            <rect x="110" y="137" width="8" height="8"/>
          </g>
        </svg>
        <p class="tagline">MOBI</p>
        <p class="mobi">Gestão Imobiliária</p>
      </div>
    </section>
    <section class="form-panel reset-panel">
      <section class="recovery" aria-labelledby="recovery-title">
        <h1 id="recovery-title">Recuperar senha</h1>
        <p>Enviamos um código para o seu e-mail!</p>
        <div class="code-inputs" aria-label="Código de recuperação com seis dígitos">
          <input aria-label="Dígito 1" inputmode="numeric" maxlength="1" autofocus />
          <input aria-label="Dígito 2" inputmode="numeric" maxlength="1" />
          <input aria-label="Dígito 3" inputmode="numeric" maxlength="1" />
          <input aria-label="Dígito 4" inputmode="numeric" maxlength="1" />
          <input aria-label="Dígito 5" inputmode="numeric" maxlength="1" />
          <input aria-label="Dígito 6" inputmode="numeric" maxlength="1" />
        </div>
        <a class="resend-link" id="resend-link" href="#reenviar">Enviar novo código</a>
        <p class="recovery-message" id="recovery-message" role="status" aria-live="polite"></p>
        <a class="back-link" href="login.html">Voltar para entrar</a>
      </section>
    </section>
  </main>
  <script src="recuperar.js"></script>
</body>
</html>
