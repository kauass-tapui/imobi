<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | MOBI</title>
  <link rel="stylesheet" href="style.css" />
  <script src="theme.js"></script>
</head>
<body>
  <main class="page">
    <section class="brand-panel" aria-label="MOBI Gestão Imobiliária">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 510 285" role="img">
          <g fill="none" stroke="currentColor" stroke-linejoin="miter">
            <path d="M35 252h27V69l67-40v62l67 41v120h26" stroke-width="5.5"/>
            <path d="M66 72v180M129 91v161M137 42l48 30v42l-48-29z" stroke-width="5"/>
          </g>
          <g fill="currentColor">
            <rect x="85" y="111" width="8" height="8"/>
            <rect x="110" y="111" width="8" height="8"/>
            <rect x="85" y="137" width="8" height="8"/>
            <rect x="110" y="137" width="8" height="8"/>
          </g>
        </svg>
        <p class="tagline">MOBI</p>
        <p class="mobi">Gestão Imobiliária</p>
      </div>
    </section>
    <section class="form-panel">
      <form id="login-form" novalidate>
        <h1>A Imobi sentiu a sua falta.<br />Bem-vindo(a) de volta!</h1>
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" placeholder="seu@email.com" required />
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" placeholder="••••••••" required />
        <p class="feedback" id="feedback" role="alert" aria-live="polite"></p>
        <button type="submit">Entrar</button>
        <a href="recuperar.html" class="forgot-link">Esqueci minha senha</a>
        <p class="new-user">Novo por aqui? <span>→</span><a href="cadastro.html">Registre-se</a></p>
      </form>
    </section>
  </main>
  <script src="login.js"></script>
</body>
</html>
